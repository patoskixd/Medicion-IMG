<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-img src="assets/images/Logo_UCT.png" alt="Logo UCT" class="uct-logo"></ion-img>
    </ion-buttons>
    <ion-title>Historial</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="results-container">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Mediciones Realizadas</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let item of history" class="measurement-item">
            <ion-label>
              <h2>Medición {{ item.tramo }}</h2>
              <p>Distancia: {{ item.distancia.toFixed(2) }} {{ unitOfMeasurement }}</p>
              <p *ngIf="item.label">Etiqueta: {{ item.label }}</p>
            </ion-label>
            <ion-checkbox slot="end" *ngIf="isClearing" [(ngModel)]="selectedMap[item.tramo]"></ion-checkbox>
            <div class="item-buttons" *ngIf="!isClearing">
              <ion-button fill="clear" (click)="addLabel(item)">
                <ion-icon slot="icon-only" name="pricetag-outline"></ion-icon>
              </ion-button>
              <ion-button fill="clear" (click)="viewMeasurement(item)">
                <ion-icon slot="icon-only" name="eye-outline"></ion-icon>
              </ion-button>
            </div>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>

    <div class="actions">
      <ion-button expand="block" color="secondary" (click)="enterClearingMode()" *ngIf="!isClearing">
        <ion-icon name="trash-outline" slot="start"></ion-icon>
        Eliminar Mediciones
      </ion-button>

      <ng-container *ngIf="isClearing">
        <ion-button expand="block" color="danger" (click)="confirmDeleteSelected()">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Eliminar Seleccionados
        </ion-button>
        <ion-button expand="block" color="warning" (click)="clearAll()">
          <ion-icon name="trash-bin-outline" slot="start"></ion-icon>
          Eliminar Todo
        </ion-button>
        <ion-button expand="block" color="medium" (click)="cancelClearing()">
          <ion-icon name="close-circle-outline" slot="start"></ion-icon>
          Cancelar
        </ion-button>
      </ng-container>
    </div>
  </div>
</ion-content>
